name: Feature request
description: Suggest an improvement to the menu-bar app or documentation.
title: "feature: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What workflow would this improve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Include any expected effect on power settings or authorization.
    validations:
      required: true
